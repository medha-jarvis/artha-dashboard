name: Sector Pulse — StockScans Sync

on:
  schedule:
    # 3:30 AM UTC = 9:00 AM IST every Sunday
    - cron: '30 3 * * 0'
  workflow_dispatch: {}

jobs:
  stockscans-sync:
    name: Sync StockScans Custom Indexes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10', cache: pip, cache-dependency-path: scripts/requirements.txt }
      - run: pip install -r scripts/requirements.txt
      - run: playwright install chromium --with-deps
      - name: Sync StockScans → Supabase
        run: python scripts/sync_stockscans.py
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STOCKSCANS_USER:      ${{ secrets.STOCKSCANS_USER }}
          STOCKSCANS_PASS:      ${{ secrets.STOCKSCANS_PASS }}

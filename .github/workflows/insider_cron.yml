name: Insider Intelligence Engine

on:
  schedule:
    # 12:30 UTC = 6:00 PM IST (after market close + other engines)
    - cron: '30 12 * * 1-5'
  workflow_dispatch:
    inputs:
      script:
        description: 'Script to run'
        required: false
        default: 'insider_engine'
        type: choice
        options: [insider_engine]

jobs:
  insider-engine:
    name: Insider Engine (6:00 PM IST)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10', cache: pip, cache-dependency-path: scripts/requirements.txt }
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/insider_engine.py
        env:
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_ANON_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}

name: PEAD Backfill

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of calendar days to backfill (default 7)'
        required: false
        default: '7'
      from_date:
        description: 'Start date YYYY-MM-DD (overrides days)'
        required: false
      to_date:
        description: 'End date YYYY-MM-DD (used with from_date)'
        required: false

jobs:
  backfill:
    name: Seed Historical PEAD Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10', cache: pip, cache-dependency-path: scripts/requirements.txt }
      - run: pip install -r scripts/requirements.txt

      - name: Run backfill (date range)
        if: ${{ github.event.inputs.from_date != '' }}
        run: python scripts/backfill.py --from ${{ github.event.inputs.from_date }} --to ${{ github.event.inputs.to_date || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Run backfill (days)
        if: ${{ github.event.inputs.from_date == '' }}
        run: python scripts/backfill.py --days ${{ github.event.inputs.days || '7' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

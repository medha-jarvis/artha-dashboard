name: Sector Pulse Engine

on:
  schedule:
    # 10:45 UTC = 4:15 PM IST — daily after market close
    - cron: '45 10 * * 1-5'
  workflow_dispatch:
    inputs:
      script:
        description: 'Script to run'
        required: true
        default: 'pulse_engine'
        type: choice
        options: [pulse_engine]

jobs:
  pulse-engine:
    name: Score Sectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10', cache: pip, cache-dependency-path: scripts/requirements.txt }
      - run: pip install -r scripts/requirements.txt
      - name: Run scoring engine
        run: python scripts/pulse_engine.py
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Send Telegram dispatch
        run: python scripts/pulse_dispatch.py
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}

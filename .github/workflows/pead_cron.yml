name: PEAD Engine

on:
  schedule:
    # 1. Overnight/pre-open: 03:30 UTC = 9:00 AM IST — catches results filed after previous close
    - cron: '30 3 * * 1-5'
    # 2. Intraday pre-close: 09:00 UTC = 2:30 PM IST — captures market-hours earnings reactions
    - cron: '00 9 * * 1-5'
    # 3. EOD drift tracker: 10:30 UTC = 4:00 PM IST — update live returns after market close
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      script:
        description: 'Script to run'
        required: true
        default: 'pead_engine'
        type: choice
        options: [pead_engine, drift_tracker]

jobs:
  # ── Runs on schedules 1 & 2 (pead_engine), or manual dispatch ──────────────
  pead-engine:
    name: PEAD Engine
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && (
        github.event.schedule == '30 3 * * 1-5' ||
        github.event.schedule == '00 9 * * 1-5'
      )) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.script == 'pead_engine')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10', cache: pip, cache-dependency-path: scripts/requirements.txt }
      - run: pip install -r scripts/requirements.txt
      - run: playwright install chromium --with-deps
      - name: Run PEAD engine
        run: python scripts/pead_engine.py
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_ANON_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}

  # ── Runs on schedule 3 (EOD drift tracker), or manual dispatch ─────────────
  drift-tracker:
    name: Drift Tracker (EOD)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '30 10 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.script == 'drift_tracker')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10', cache: pip, cache-dependency-path: scripts/requirements.txt }
      - run: pip install -r scripts/requirements.txt
      - name: Run drift tracker
        run: python scripts/drift_tracker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

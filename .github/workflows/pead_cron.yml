name: PEAD Engine

on:
  schedule:
    - cron: '15 10 * * 1-5'   # pead_engine  — 10:15 UTC = 3:45 PM IST
    - cron: '45 10 * * 1-5'   # drift_tracker — 10:45 UTC = 4:15 PM IST
  workflow_dispatch:
    inputs:
      script:
        description: 'Script to run'
        required: true
        default: 'pead_engine'
        type: choice
        options: [pead_engine, drift_tracker, backfill]
      days_back:
        description: 'Days to backfill (backfill only)'
        required: false
        default: '7'

jobs:
  pead-engine:
    name: PEAD Engine (3:45 PM IST)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '15 10 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.script == 'pead_engine')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10', cache: pip, cache-dependency-path: scripts/requirements.txt }
      - run: pip install -r scripts/requirements.txt
      - run: playwright install chromium --with-deps
      - run: python scripts/pead_engine.py
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:        ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}

  drift-tracker:
    name: Drift Tracker (4:15 PM IST)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '45 10 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.script == 'drift_tracker')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10', cache: pip, cache-dependency-path: scripts/requirements.txt }
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/drift_tracker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  backfill:
    name: Backfill Historical Data
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.script == 'backfill'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10', cache: pip, cache-dependency-path: scripts/requirements.txt }
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/backfill.py --days ${{ github.event.inputs.days_back || '7' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
